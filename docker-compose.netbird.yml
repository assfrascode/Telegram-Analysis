# Optional overlay for exposing selected services through a NetBird peer.
# Usage:
#   NB_SETUP_KEY=... docker compose -f docker-compose.yml -f docker-compose.netbird.yml up -d --build
services:
  netbird-client:
    image: netbirdio/netbird:${NETBIRD_IMAGE_TAG:-latest}
    container_name: ${NETBIRD_CONTAINER_NAME:-chat-analyse-netbird-client}
    hostname: ${NETBIRD_HOSTNAME:-chat-analyse-netbird}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
    environment:
      NB_SETUP_KEY: ${NB_SETUP_KEY:?Set NB_SETUP_KEY in .env or export it before starting the NetBird overlay}
      NB_MANAGEMENT_URL: ${NB_MANAGEMENT_URL:-https://api.netbird.io:443}
      NB_ADMIN_URL: ${NB_ADMIN_URL:-https://app.netbird.io:443}
      NB_LOG_LEVEL: ${NB_LOG_LEVEL:-info}
      NB_EXTRA_DNS_LABELS: ${NB_EXTRA_DNS_LABELS:-}
    volumes:
      - netbird-client:/var/lib/netbird

  netbird-proxy:
    image: caddy:${NETBIRD_PROXY_CADDY_TAG:-2-alpine}
    container_name: ${NETBIRD_PROXY_CONTAINER_NAME:-chat-analyse-netbird-proxy}
    restart: unless-stopped
    network_mode: service:netbird-client
    depends_on:
      netbird-client:
        condition: service_started
      backend:
        condition: service_started
      chat-analyse-frontend:
        condition: service_started
    environment:
      NETBIRD_FRONTEND_UPSTREAM: ${NETBIRD_FRONTEND_UPSTREAM:-chat-analyse-frontend:80}
      NETBIRD_BACKEND_UPSTREAM: ${NETBIRD_BACKEND_UPSTREAM:-backend:8000}
      NETBIRD_LITELLM_UPSTREAM: ${NETBIRD_LITELLM_UPSTREAM:-litellm:4000}
    volumes:
      - ./docker/netbird/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  netbird-client:
