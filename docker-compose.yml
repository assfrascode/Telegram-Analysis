services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chat_analyse
      POSTGRES_USER: chat_analyse
      POSTGRES_PASSWORD: chat_analyse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_analyse -d chat_analyse"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  # Optional GPU model server for embeddings.
  # Start with: docker compose --profile models up --build
  vllm-embedding:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    profiles: ["models"]
    # The vllm-openai image starts `vllm serve`; provide the model as
    # positional argument. Do not use `--task`: recent vLLM images removed or
    # changed that flag and auto-detect embedding/pooling models here.
    command:
      - "${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}"
      - "--served-model-name"
      - "${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "auto"
      - "--gpu-memory-utilization"
      - "${VLLM_EMBEDDING_GPU_MEMORY_UTILIZATION:-0.35}"
      - "--trust-remote-code"
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8011:8000"
    ipc: host
    shm_size: "2gb"
    gpus: all

  # Optional GPU model server for reranking/scoring.
  # The backend tries /v1/rerank first and falls back to /v1/score.
  vllm-reranker:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    profiles: ["models"]
    # The vllm-openai image starts `vllm serve`; provide the model as
    # positional argument. Do not use `--task`: the backend tries /v1/rerank
    # and falls back to /v1/score depending on the vLLM build.
    command:
      - "${RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}"
      - "--served-model-name"
      - "${RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "auto"
      - "--gpu-memory-utilization"
      - "${VLLM_RERANKER_GPU_MEMORY_UTILIZATION:-0.35}"
      - "--trust-remote-code"
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8012:8000"
    ipc: host
    shm_size: "2gb"
    gpus: all

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
      qdrant:
        condition: service_started

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    command: ["python", "-m", "app.workers.run_worker", "all"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
      qdrant:
        condition: service_started

  chat-analyse-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: chat-analyse-react-frontend:local
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      BACKEND_URL: "${BACKEND_URL:-http://backend:8000}"
      CLIENT_MAX_BODY_SIZE: "${CLIENT_MAX_BODY_SIZE:-1024m}"
      PROXY_READ_TIMEOUT: "${PROXY_READ_TIMEOUT:-3600s}"
      PROXY_SEND_TIMEOUT: "${PROXY_SEND_TIMEOUT:-3600s}"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
  nats-data:
  minio-data:
  qdrant-data:
  hf-cache:
