[project]
name = "chat-analyse-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3.0",
  "cryptography>=43.0.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.1",
  "nats-py>=2.8.0",
  "minio>=7.2.7",
  "qdrant-client>=1.10.1",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "orjson>=3.10.7",
  "aiofiles>=24.1.0",
  "ijson>=3.3.0",
  "telethon>=1.40.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"
