[project]
name = "chat-analyse-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.3",
  "uvicorn[standard]==0.48.0",
  "pydantic==2.12.4",
  "pydantic-settings==2.12.0",
  "sqlalchemy[asyncio]==2.0.43",
  "alembic==1.16.5",
  "asyncpg==0.31.0",
  "prometheus-client==0.21.1",
  "python-multipart==0.0.29",
  "python-jose[cryptography]==3.5.0",
  "cryptography==46.0.3",
  "argon2-cffi==25.1.0",
  "nats-py==2.14.0",
  "minio==7.2.20",
  "qdrant-client==1.18.0",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "beautifulsoup4==4.13.5",
  "bleach==6.3.0",
  "markdown==3.8",
  "orjson==3.11.9",
  "aiofiles==25.1.0",
  "ijson==3.5.0",
  "telethon==1.43.2",
  "tiktoken==0.13.0"
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2"
]

[tool.ruff]
line-length = 100
target-version = "py312"
